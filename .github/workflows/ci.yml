name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify lock file
        run: uv lock --check --python 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Ruff check
        run: uv run --python 3.12 ruff check --diff .

      - name: Ruff format check
        run: uv run --python 3.12 ruff format --check .

      - name: Mypy
        run: uv run --python 3.12 mypy

      - name: Pytest
        run: uv run --python 3.12 pytest

  test-python-313:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify lock file
        run: uv lock --check --python 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.13

      - name: Pytest
        run: uv run --python 3.13 pytest
