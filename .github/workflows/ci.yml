name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve lock file
        run: uv lock --python 3.12

      - name: Commit generated lock file if needed
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: add generated uv lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Ruff check
        run: uv run --python 3.12 ruff check .

      - name: Ruff format check
        run: uv run --python 3.12 ruff format --check .

      - name: Mypy
        run: uv run --python 3.12 mypy

      - name: Pytest
        run: uv run --python 3.12 pytest

  test-python-313:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Resolve lock file
        run: uv lock --python 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.13

      - name: Pytest
        run: uv run --python 3.13 pytest
