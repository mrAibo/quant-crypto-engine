name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve lock file
        run: uv lock --python 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Ruff check
        run: uv run --python 3.12 ruff check .

      - name: Ruff format check
        run: uv run --python 3.12 ruff format --check .

      - name: Mypy
        run: uv run --python 3.12 mypy

      - name: Pytest
        run: uv run --python 3.12 pytest

      - name: Upload resolved lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

      - name: Require committed lock file
        run: |
          if [ -n "$(git status --porcelain -- uv.lock)" ]; then
            echo "uv.lock is missing or out of date. Commit the generated lock artifact."
            git status --short -- uv.lock
            exit 1
          fi

  test-python-313:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Resolve lock file
        run: uv lock --python 3.13

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.13

      - name: Pytest
        run: uv run --python 3.13 pytest
