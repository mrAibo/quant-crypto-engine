name: TASK-009 Live Public Smoke

on:
  push:
    branches: [task-009-public-recorder-runtime]
    paths:
      - ".github/workflows/task009-live-smoke.yml"

permissions:
  contents: read

jobs:
  live-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify lock file
        run: uv lock --check --python 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Run real Hyperliquid public-only smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/live-smoke
          timeout --signal=TERM --kill-after=10s 70s             uv run --python 3.12 python -m cryptobot.cli run-public-recorder             --config config/runtime/public-recorder-smoke.json             | tee /tmp/task009-live-summary.json

          echo "--- STORAGE AUDIT ---"
          uv run --python 3.12 python -m cryptobot.cli audit-public-recorder             --config config/runtime/public-recorder-smoke.json

          echo "--- SUMMARY SHA256 ---"
          sha256sum /tmp/task009-live-summary.json
