name: TASK-010 Timestamp Probe

on:
  push:
    branches: [task-010-hyperliquid-book-normalization]
    paths:
      - ".github/workflows/task010-timestamp-probe.yml"

permissions:
  contents: read

jobs:
  timestamp-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - name: Probe l2Book and bbo time scale
        shell: bash
        run: |
          uv run --python 3.12 python - <<'PY'
          import asyncio, json, time
          from websockets.asyncio.client import connect

          async def main():
              wanted = {"l2Book", "bbo"}
              seen = {}
              async with connect(
                  "wss://api.hyperliquid.xyz/ws",
                  ping_interval=None,
                  ping_timeout=None,
                  compression=None,
                  open_timeout=10,
                  close_timeout=5,
                  max_size=4_194_304,
              ) as ws:
                  for channel in sorted(wanted):
                      await ws.send(json.dumps({
                          "method":"subscribe",
                          "subscription":{"type":channel,"coin":"BTC"},
                      }))
                  deadline = time.monotonic() + 30
                  while wanted - seen.keys():
                      if time.monotonic() > deadline:
                          raise TimeoutError("did not observe both target channels")
                      raw = await asyncio.wait_for(ws.recv(), timeout=10)
                      msg = json.loads(raw)
                      ch = msg.get("channel")
                      if ch not in wanted:
                          continue
                      recv_wall_ms = time.time_ns() // 1_000_000
                      data = msg["data"]
                      source_time = data["time"]
                      seen[ch] = {
                          "channel": ch,
                          "coin": data.get("coin"),
                          "source_time": source_time,
                          "recv_wall_ms": recv_wall_ms,
                          "recv_minus_source_ms": recv_wall_ms - source_time,
                          "source_time_type": type(source_time).__name__,
                      }
              print(json.dumps({"observations":seen}, sort_keys=True))
          asyncio.run(main())
          PY
