name: TASK-011 Trade Probe

on:
  push:
    branches: [task-011-hyperliquid-trade-normalization]
    paths:
      - ".github/workflows/task011-trade-probe.yml"

permissions:
  contents: read

jobs:
  trade-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - name: Probe public trade shape and timestamp scale
        shell: bash
        run: |
          uv run --python 3.12 python - <<'PY'
          import asyncio, json, time
          from websockets.asyncio.client import connect

          async def main():
              async with connect(
                  "wss://api.hyperliquid.xyz/ws",
                  ping_interval=None,
                  ping_timeout=None,
                  compression=None,
                  open_timeout=10,
                  close_timeout=5,
                  max_size=4_194_304,
              ) as ws:
                  await ws.send(json.dumps({
                      "method":"subscribe",
                      "subscription":{"type":"trades","coin":"BTC"},
                  }))
                  deadline=time.monotonic()+30
                  while True:
                      if time.monotonic()>deadline:
                          raise TimeoutError("no BTC trades observed")
                      raw=await asyncio.wait_for(ws.recv(),timeout=10)
                      msg=json.loads(raw)
                      if msg.get("channel")!="trades":
                          continue
                      data=msg.get("data")
                      if not isinstance(data,list) or not data:
                          continue
                      recv_ms=time.time_ns()//1_000_000
                      sample=data[0]
                      users=sample.get("users")
                      tid=sample.get("tid")
                      h=sample.get("hash")
                      out={
                          "array_len":len(data),
                          "keys":sorted(sample.keys()),
                          "coin":sample.get("coin"),
                          "side":sample.get("side"),
                          "px_type":type(sample.get("px")).__name__,
                          "sz_type":type(sample.get("sz")).__name__,
                          "time_type":type(sample.get("time")).__name__,
                          "source_time":sample.get("time"),
                          "recv_wall_ms":recv_ms,
                          "recv_minus_source_ms":recv_ms-sample["time"],
                          "tid_type":type(tid).__name__,
                          "tid_bit_length":tid.bit_length() if isinstance(tid,int) else None,
                          "hash_type":type(h).__name__,
                          "hash_length":len(h) if isinstance(h,str) else None,
                          "hash_prefix":h[:2] if isinstance(h,str) else None,
                          "users_type":type(users).__name__,
                          "users_len":len(users) if isinstance(users,list) else None,
                          "user_item_types":[type(x).__name__ for x in users] if isinstance(users,list) else None,
                      }
                      print(json.dumps(out,sort_keys=True))
                      return
          asyncio.run(main())
          PY
