name: TASK-011 Trade Probe

on:
  push:
    branches: [task-011-hyperliquid-trade-normalization]
    paths:
      - ".github/workflows/task011-trade-probe.yml"

permissions:
  contents: read

jobs:
  trade-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - name: Probe initial trade batches and reconnect overlap
        shell: bash
        run: |
          uv run --python 3.12 python - <<'PY'
          import asyncio, json, time
          from websockets.asyncio.client import connect

          URL="wss://api.hyperliquid.xyz/ws"

          async def collect(session: int, batches: int = 3):
              observations=[]
              identities=set()
              async with connect(
                  URL,
                  ping_interval=None,
                  ping_timeout=None,
                  compression=None,
                  open_timeout=10,
                  close_timeout=5,
                  max_size=4_194_304,
              ) as ws:
                  await ws.send(json.dumps({
                      "method":"subscribe",
                      "subscription":{"type":"trades","coin":"BTC"},
                  }))
                  deadline=time.monotonic()+30
                  while len(observations)<batches:
                      if time.monotonic()>deadline:
                          raise TimeoutError("insufficient BTC trade batches")
                      raw=await asyncio.wait_for(ws.recv(),timeout=10)
                      msg=json.loads(raw)
                      if msg.get("channel")!="trades":
                          continue
                      data=msg.get("data")
                      if not isinstance(data,list) or not data:
                          continue
                      recv_ms=time.time_ns()//1_000_000
                      times=[t["time"] for t in data]
                      for t in data:
                          identities.add((t["time"],t["coin"],t["tid"]))
                      observations.append({
                          "session":session,
                          "batch_index":len(observations),
                          "array_len":len(data),
                          "recv_wall_ms":recv_ms,
                          "min_source_time":min(times),
                          "max_source_time":max(times),
                          "oldest_lag_ms":recv_ms-min(times),
                          "newest_lag_ms":recv_ms-max(times),
                          "sides":sorted({t["side"] for t in data}),
                          "tid_bit_length_max":max(t["tid"].bit_length() for t in data),
                          "all_required_keys":all(set(t)=={"coin","side","px","sz","hash","time","tid","users"} for t in data),
                          "all_users_pairs":all(isinstance(t["users"],list) and len(t["users"])==2 for t in data),
                      })
              return observations, identities

          async def main():
              first, ids1=await collect(1)
              await asyncio.sleep(1)
              second, ids2=await collect(2)
              print(json.dumps({
                  "batches":first+second,
                  "session1_unique_ids":len(ids1),
                  "session2_unique_ids":len(ids2),
                  "reconnect_identity_overlap":len(ids1 & ids2),
              },sort_keys=True))
          asyncio.run(main())
          PY
