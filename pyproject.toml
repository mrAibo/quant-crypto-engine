[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quant-crypto-engine"
version = "0.1.0"
description = "Evidence-driven research and engineering framework for autonomous crypto trading."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "mrAibo" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cryptobot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
